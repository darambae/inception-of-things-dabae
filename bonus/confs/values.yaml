global:
  hosts:
    domain: 127.0.0.1.nip.io
    https: false
  ingress:
    configureCertmanager: false 
    tls:
      enabled: false
    enabled: true
    provider: traefik
    class: traefik
    gatewayAPI:
      enabled: false
  edition: ce
  psql:
    host: gitlab-postgresql.gitlab.svc.cluster.local
    port: 5432
    database: gitlabhq_production
    username: gitlab
    password:
      secret: gitlab-postgresql-password
      key: postgresql-password
  redis:
    host: gitlab-redis-master.gitlab.svc.cluster.local
    auth:
      enabled: false
  certmanager:
    enabled: false
  kas:
    enabled: false
  gitlab-exporter:
    enabled: false
  appConfig:
    artifacts:
      enabled: false
    lfs:
      enabled: false
    uploads:
      enabled: false
    packages:
      enabled: false
    backups:
      bucket: ""
      tmpBucket: ""

envoy-gateway:
  enabled: false
certmanager:
  enabled: false
certmanager-issuer:
  enabled: false
  email: admin@test.com
prometheus:
  install: false
gitlab-runner:
  install: false
nginx-ingress:
  enabled: false

postgresql:
  install: false
redis:
  install: false

kas:
  enabled: false
registry:
  enabled: false
gitlab-exporter:
  enabled: false

gitlab:
  kas:
    enabled: false
  gitlab-exporter:
    enabled: false
  toolbox:
    enabled: true 
    backups:
      cron:
        enabled: false
      objectStorage:
        config:
          secret: gitlab-objectstorage-secret
          key: connection

  webservice:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    hpa:
      enabled: false
    resources:
      requests:
        memory: 1.5Gi
        cpu: 200m

  sidekiq:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    hpa:
      enabled: false
    resources:
      requests:
        memory: 450Mi
        cpu: 100m

  gitlab-shell:
    replicas: 1
    minReplicas: 1
    maxReplicas: 1
    hpa:
      enabled: false
    resources:
      requests:
        memory: 64Mi
        cpu: 50m