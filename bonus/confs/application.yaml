apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app-controller
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'http://gitlab.127.0.0.1.nip.io/root/inception-of-things-bonus.git'
    targetRevision: HEAD
    path: bonus/confs
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: dev
  syncPolicy:
    automated:
      selfHeal: true
      prune: true